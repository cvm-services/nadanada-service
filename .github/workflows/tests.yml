name: tests

# Real per-commit CI: the Python suite (offline; no browser, no network, no live
# mint) and the Deno announcement conformance/parity checks. Discovery and live
# evidence are operator-run (they need a browser and the dashboard token).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run the test suite
        run: python -m pytest -q

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"
      - name: Announcement conformance + fixture parity
        run: |
          deno task test
          deno task announce:check
